<!DOCTYPE html>
<!--Client-Server -->

<html>
<head>
    <meta charset="UTF-8">
  <title>Smart Factory – Temperature Safety Status</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 40px;
    display: flex;
    flex-direction: column;  
    align-items: center;      
    }

	h2 {
  margin-top: 0;
        text-align: center;
        font-size: 22px;
    }

    .container {
        width: 480px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 12px rgba(0,0,0,0.15);
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
    }
    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }
	
	button:hover {
    background: #555;
    }

    button {
		background: #3a3a3a;
		color: white;
		padding: 10px 20px;
		border: none;
		border-radius: 6px;
		font-size: 16px;
    }

    .button-container {
		display: flex;
		justify-content: center;
		margin-top: 15px;
    }

    #output {
        margin-top: 25px;
        background: #fafafa;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 15px;
        height: 260px;
        overflow-y: auto;
        font-size: 14px;
        white-space: normal;
        word-break: break-word; 
        line-height: 1.4;
    }

    .page-title {
		text-align: center;
		font-size: 28px;
		margin-bottom: 25px;
		margin-top: 0;
    }

  </style>
</head>

<body>
  <h2 class="page-title">Temperature Safety Service (Client-ServerSide Streaming)</h2> 

  <div class="container">
  
     <!-- Sensor ID Input -->
    <label for="sensorIdInput">Sensor ID:</label>
    <input type="text" id="sensorIdInput" placeholder="e.g., AC-GroundFloor">

    <!-- Threshold Input -->
    <label for="thresholdInput">Threshold (°C):</label>
	<input type="number" id="thresholdInput" autocomplete="off">

    <!-- Button -->
     <div class="button-container">
         <button onclick="invokeClientServer()"> Temperature Check</button>
     </div>
    <div id="output" class="output"></div>
  </div>

  <script src="client_browser.js"></script>
</body>
</html>
