syntax = "proto3"; 
package unary; 
// My simple service with unary RPC method to check the status of a given machine. 

service MachineStatusService {
	rpc CheckMachineStatus (MachineRequest) returns (MachineResponse);
}

// Request message
message MachineRequest {
  string machineId = 1;
}

// Reply message
message MachineResponse {
  string machineId = 1;
 bool isRunning = 2;
string statusMessage = 3;
} 
