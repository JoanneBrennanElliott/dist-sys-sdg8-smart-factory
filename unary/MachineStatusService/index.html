<!DOCTYPE html>
<html>
<head>
  <title>Smart Factory – Machine Status</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    margin: 40px;
    justify-content: center;
}
	h2 {
    margin-bottom: 12px;
    font-size: 20px;
    color: #333;
    text-align: left;
}
.box {
    width: 380px;
    padding: 20px;
    background: #ffffff;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
	
	button:hover {
    background: ##555555;
}
    .output { 
	margin-top: 15px; 
	padding: 10px; 
	background: #f5f5f5; 
	min-height: 40px; }
  </style>
</head>

<body>
  <div><h2>Machine Status Service (Unary)</h2> </div>

  <div class="box">
    <label>Machine ID:</label><br>
    <input id="machineIdInput" type="text" placeholder="e.g. machine-01"><br><br>

    <button onclick="invokeUnary()">Check Status</button>

    <div id="output" class="output"></div>
  </div>

  <script src="client_browser.js"></script>
</body>
</html>
